# Alembic reads DATABASE_URL from the environment. The URL below is only a placeholder
# so the config key exists; env.py replaces it before connecting.

[alembic]
script_location = %(here)s/alembic
path_separator = os
sqlalchemy.url = postgresql+psycopg://patchpilot:patchpilot_dev@127.0.0.1:5432/patchpilot

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
