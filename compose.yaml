# Local development only. The default password is an example credential, not a secret to reuse.
# Override POSTGRES_USER, POSTGRES_PASSWORD, and POSTGRES_DB in an untracked .env file.

name: patchpilot

services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-patchpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patchpilot_dev}
      POSTGRES_DB: ${POSTGRES_DB:-patchpilot}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    image: patchpilot:local
    # Migrate before serving. The worker uses the schema and does not run migrations.
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn patchpilot.api:create_app --factory --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-patchpilot}:${POSTGRES_PASSWORD:-patchpilot_dev}@db:5432/${POSTGRES_DB:-patchpilot}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    image: patchpilot:local
    command: ["python", "-m", "patchpilot.worker"]
    # host-gateway is the host address on the Compose network. Port 11434 stays
    # unpublished. See the README before pointing this service at Ollama.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-patchpilot}:${POSTGRES_PASSWORD:-patchpilot_dev}@db:5432/${POSTGRES_DB:-patchpilot}
      WORKER_IDLE_SLEEP_SECONDS: ${WORKER_IDLE_SLEEP_SECONDS:-2}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-30}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_MODEL: ${LLM_MODEL:-gemma4:12b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
