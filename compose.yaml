# Local development only. The default password is an example credential, not a secret to reuse.
# Override POSTGRES_USER, POSTGRES_PASSWORD, and POSTGRES_DB in an untracked .env file.

name: patchpilot

services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-patchpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patchpilot_dev}
      POSTGRES_DB: ${POSTGRES_DB:-patchpilot}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    image: patchpilot:local
    # Migrate before serving. The worker uses the schema and does not run migrations.
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn patchpilot.api:create_app --factory --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-patchpilot}:${POSTGRES_PASSWORD:-patchpilot_dev}@db:5432/${POSTGRES_DB:-patchpilot}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-3}
      ARTIFACTS_ROOT: /artifacts
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - artifacts:/artifacts
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    image: patchpilot:local
    command: ["python", "-m", "patchpilot.worker"]
    # host-gateway is the host address on the Compose network. Port 11434 stays
    # unpublished. See the README before pointing this service at Ollama.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-patchpilot}:${POSTGRES_PASSWORD:-patchpilot_dev}@db:5432/${POSTGRES_DB:-patchpilot}
      WORKER_IDLE_SLEEP_SECONDS: ${WORKER_IDLE_SLEEP_SECONDS:-2}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-30}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      INVESTIGATOR_MAX_TOOL_CALLS: ${INVESTIGATOR_MAX_TOOL_CALLS:-6}
      SUPERVISOR_MODEL: ${SUPERVISOR_MODEL:-false}
      ARTIFACTS_ROOT: /artifacts
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_MODEL: ${LLM_MODEL:-gemma4:12b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_RETRY_BACKOFF_SECONDS: ${LLM_RETRY_BACKOFF_SECONDS:-0.5}
      LLM_STAGE_MODELS: ${LLM_STAGE_MODELS:-}
      OLLAMA_TOOL_CALLING: ${OLLAMA_TOOL_CALLING:-false}
      # Cloud stays off. A key is read only by this service, and only when enabled.
      LLM_CLOUD_ENABLED: ${LLM_CLOUD_ENABLED:-false}
      LLM_CLOUD_BASE_URL: ${LLM_CLOUD_BASE_URL:-}
      LLM_CLOUD_API_KEY: ${LLM_CLOUD_API_KEY:-}
      LLM_CLOUD_CAPABILITIES: ${LLM_CLOUD_CAPABILITIES:-}
      LLM_PRICING_PATH: ${LLM_PRICING_PATH:-}
      TASK_MAX_MODEL_CALLS: ${TASK_MAX_MODEL_CALLS:-24}
      TASK_MAX_TOOL_CALLS: ${TASK_MAX_TOOL_CALLS:-12}
      TASK_MAX_TOKENS: ${TASK_MAX_TOKENS:-100000}
      TASK_MAX_RUNTIME_SECONDS: ${TASK_MAX_RUNTIME_SECONDS:-900}
      TASK_MAX_PARALLELISM: ${TASK_MAX_PARALLELISM:-1}
      TASK_MAX_REPAIRS: ${TASK_MAX_REPAIRS:-2}
      # Publication stays off. The token is read only by this service, and only
      # when GITHUB_ENABLED is true. The API and the runner do not receive it.
      GITHUB_ENABLED: ${GITHUB_ENABLED:-false}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_BASE: ${GITHUB_API_BASE:-https://api.github.com}
      GITHUB_ALLOWED_REPOS: ${GITHUB_ALLOWED_REPOS:-}
      # Checkouts registered under this directory. The host path is
      # REPOSITORY_ROOT_HOST. The worker sees only /repositories, read-only.
      REPOSITORY_ROOT: /repositories
      # Private clones. Git writes only here, never into /repositories.
      WORKSPACE_ROOT: /workspaces
      # Job directory shared with the runner service. This process only writes
      # a job id and reads the result. It does not receive a command to run.
      RUNNER_ROOT: /runner
      RUNNER_TIMEOUT_SECONDS: ${RUNNER_TIMEOUT_SECONDS:-30}
      RUNNER_WAIT_SECONDS: ${RUNNER_WAIT_SECONDS:-45}
    volumes:
      - ${REPOSITORY_ROOT_HOST:-./examples}:/repositories:ro
      - artifacts:/artifacts
      - workspaces:/workspaces
      # Job files only. The runner, not this process, executes pytest.
      - runner:/runner
    depends_on:
      db:
        condition: service_healthy

  # Pytest runs here, never in the API or the worker. The request file is a job
  # id. This service does not receive the database password or model settings.
  # network_mode none is the no-network policy. The shared runner volume is one
  # tree for every job, which is weaker than a fresh mount per task, so the
  # worker concurrency stays 1.
  runner:
    build: .
    image: patchpilot:local
    command: ["python", "-m", "patchpilot.runner"]
    user: "1000:1000"
    network_mode: "none"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: "0.50"
    environment:
      RUNNER_ROOT: /runner
      RUNNER_TIMEOUT_SECONDS: ${RUNNER_TIMEOUT_SECONDS:-30}
      RUNNER_POLL_SECONDS: ${RUNNER_POLL_SECONDS:-0.2}
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - runner:/runner

volumes:
  pgdata:
  artifacts:
  workspaces:
  runner:
