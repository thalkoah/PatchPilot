services:
  minitask:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - minitask_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  minitask_data:
